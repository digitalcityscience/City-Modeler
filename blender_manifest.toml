[permissions]
files = "Import and export CityGML files and load bundled tools"
network = "Connect to 3DCityDB instances and Docker services"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".pytest_cache/",
  "/.git/",
  "/.vscode/",
  "/.cache/",
  "/build/",
  "/.tmp_blender_*/",
  "/scripts/",
  "/devops-how-to-master/",
  "/test_files/",
  "/.cac-verification/",
  "/cac-out/",
  "/docs/",
  "/.githooks/",
  "/citydb-tool-*/samples/",
  "/AGENTS.md",
  "/LOCAL_DEVELOPMENT.md",
  "/README_DE.md",
  "/.gitignore",
  "/.gitlab-ci.yml",
  "/dependencies.yaml",
  "/gitlab-pipeline-log.txt",
  "/.dep_version",
  "/*.pyc",
  "/*.pyo",
  "*.zip",
]
