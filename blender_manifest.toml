schema_version = "1.0.0"

id = "city_modeler"
version = "0.1.1"
name = "City Modeler"
tagline = "Model 3D cities in Blender: CityGML, 3DCityDB, CityJSON soon"
maintainer = "Mehmet Akif Ortak"
type = "add-on"

website = "https://www.hcu-hamburg.de/"
tags = ["Import-Export"]
blender_version_min = "5.0.0"

license = [
  "SPDX:MIT",
]
copyright = [
  "2026 Virtual City Systems",
  "2026 Mehmet Akif Ortak, HafenCity University Hamburg",
]

# Generated by `python scripts/fetch_deps.py --python-only` from dependencies.yaml.
# Blender selects the wheel matching the running OS and Python version and ignores the
# rest, so this lists every supported platform. Do not edit by hand: the resolved
# filenames don't match the platforms requested for them (see update_manifest_wheels).
